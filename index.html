<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8c8dc"><title>日本語 drills</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#161616;background:#f8c8dc}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;padding:18px 14px 40px;background:linear-gradient(135deg,#f8c8dc 0%,#cdefff 50%,#fff3b0 100%)}
.shell{max-width:520px;margin:0 auto}
header{text-align:center;background:#fffaf0;border:4px solid #161616;border-radius:26px;padding:22px 20px;margin-bottom:18px;box-shadow:6px 6px 0 #161616}
h1{font-size:clamp(2rem,9vw,2.8rem);line-height:1.2;margin:0 0 7px;font-weight:950}
p{line-height:1.45;margin:0}.sub{font-weight:700;font-size:1rem}
nav{display:grid;gap:16px}
a.card{display:block;text-decoration:none;color:#161616;background:#cdefff;border:4px solid #161616;border-radius:20px;padding:20px 18px;box-shadow:6px 6px 0 #161616}

a.card.audio{background:#fff3b0}
a.card:focus-visible{outline:3px solid #6747ad;outline-offset:8px}
a.card:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #161616}
.name{display:block;font-size:1.25rem;font-weight:950;margin-bottom:6px}
.desc{display:block;font-size:.95rem;line-height:1.4;font-weight:550}
.foot{margin-top:24px;text-align:center;font-size:.86rem;font-weight:650}
